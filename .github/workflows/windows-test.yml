# 说明：这是给 GitHub Actions 用的自动化测试流水线。
# 只有把这个文件夹作为仓库推到 GitHub 之后才会生效；
# 在 Windows 上直接使用本工具完全不需要它（删掉整个 .github 文件夹也不影响工具本身）。
#
# 注意：GitHub Actions 的 shell: 关键字不支持 matrix 上下文，
# 所以这里不写 matrix，而是给两个引擎各写一个短步骤。

name: Windows Cleaner Test

on:
  push:
  workflow_dispatch:
    inputs:
      real_cleanup:
        description: '在 runner 上执行真实清理（安全项，会删掉 runner 自己的系统临时文件）'
        type: boolean
        default: false

jobs:
  test:
    name: 双引擎测试（Windows PowerShell 5.1 + PowerShell 7）
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 01 环境信息
        shell: powershell
        run: |
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch {}
          "PSVersion : $($PSVersionTable.PSVersion)  ($($PSVersionTable.PSEdition))"
          "OS        : $([Environment]::OSVersion.VersionString)"
          try { "Caption   : $((Get-CimInstance Win32_OperatingSystem).Caption)" } catch {}
          $isAdmin = $false
          try {
            $isAdmin = (New-Object Security.Principal.WindowsPrincipal(
              [Security.Principal.WindowsIdentity]::GetCurrent()
            )).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          } catch {}
          "IsAdmin   : $isAdmin"
          "TEMP      : $env:TEMP"
          foreach ($c in 'Clear-RecycleBin','Delete-DeliveryOptimizationCache','Get-Service','Stop-Service','takeown','icacls') {
            "{0,-34}: {1}" -f $c, [bool](Get-Command $c -ErrorAction SilentlyContinue)
          }
          foreach ($p in '%TEMP%','%SystemRoot%\Temp','%SystemRoot%\SoftwareDistribution\Download','%SystemRoot%\Prefetch','%LOCALAPPDATA%\Microsoft\Windows\Explorer') {
            "{0,-52}: {1}" -f $p, (Test-Path -LiteralPath ([System.Environment]::ExpandEnvironmentVariables($p)))
          }

      - name: 02 逻辑测试 — Windows PowerShell 5.1
        shell: powershell
        run: |
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch {}
          .\tests\CleanTemp.Tests.ps1

      - name: 03 逻辑测试 — PowerShell 7
        shell: pwsh
        run: .\tests\CleanTemp.Tests.ps1

      - name: 04 预览清理 — Windows PowerShell 5.1（不删除任何文件）
        shell: powershell
        run: |
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch {}
          .\CleanTemp.ps1 -DryRun -Deep -NoLog

      - name: 05 预览清理 — PowerShell 7（不删除任何文件）
        shell: pwsh
        run: .\CleanTemp.ps1 -DryRun -Deep -NoLog

      - name: 06 真实清理（仅手动触发且勾选时）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.real_cleanup == 'true' }}
        shell: powershell
        run: |
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch {}
          .\CleanTemp.ps1 -Safe -Yes -NoLog
          "exit code: $LASTEXITCODE"
        # runner 是一次性的，跑坏了也无所谓；可能影响收尾步骤，故放在最后并允许失败
        continue-on-error: true
